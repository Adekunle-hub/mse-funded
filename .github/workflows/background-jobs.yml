name: Background jobs

on:
  schedule:
    - cron: "17 */3 * * *"
    - cron: "47 4 * * *"
    - cron: "47 5 * * *"
    - cron: "47 7 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: Which job to run
        type: choice
        options: [pipeline, recheck, discover, remind, cleanup]
        default: pipeline

concurrency:
  group: background-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: production
      RUN_SCHEDULES: "false"
      REDIS_URL: redis://localhost:6379
      CLIENT_ORIGIN: https://msefunded.orbgnost.com
      API_URL: https://api.msefunded.orbgnost.com
      EMAIL_FROM: MseFunded <dev@orbgnost.com>
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Choose the job for this run
        id: task
        run: |
          case "${{ github.event.schedule }}" in
            "47 4 * * *") task=recheck ;;
            "47 5 * * *") task=discover ;;
            "47 7 * * *") task=remind ;;
            "17 */3 * * *") task=pipeline ;;
            *) task="${{ inputs.task }}" ;;
          esac
          echo "task=${task:-pipeline}" >> "$GITHUB_OUTPUT"

      - run: npm ci --include=dev
      - run: npm run build

      - name: Publish what the last run read
        if: steps.task.outputs.task == 'pipeline'
        timeout-minutes: 25
        continue-on-error: true
        run: npm run verify

      - name: Crawl sources
        if: steps.task.outputs.task == 'pipeline'
        timeout-minutes: 40
        continue-on-error: true
        run: npm run crawl

      - name: Read new pages with Gemini
        if: steps.task.outputs.task == 'pipeline'
        timeout-minutes: 55
        continue-on-error: true
        run: npm run extract

      - name: Publish what this run read
        if: steps.task.outputs.task == 'pipeline'
        timeout-minutes: 25
        run: npm run verify

      - name: Re-check live listings
        if: steps.task.outputs.task == 'recheck'
        run: npm run recheck

      - name: Discover new pages
        if: steps.task.outputs.task == 'discover'
        run: npm run discover

      - name: Send deadline reminders
        if: steps.task.outputs.task == 'remind'
        run: npm run remind

      - name: Clean up old page copies
        if: steps.task.outputs.task == 'remind' || steps.task.outputs.task == 'cleanup'
        run: npm run cleanup
